# Локально: `make up` (значения по умолчанию ниже).
# На сервере: `scripts/server_up.sh` — подставит секреты из .env.prod.

# логи контейнеров без ротации за месяцы работы забивают диск
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker}
      POSTGRES_DB: poker
    # только localhost: Docker публикует порты в обход ufw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_LEVEL: INFO
      POSTGRES_DSN: postgresql+asyncpg://poker:${POSTGRES_PASSWORD:-poker}@postgres:5432/poker
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      GUEST_START_BALANCE: ${GUEST_START_BALANCE:-10000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # data примонтирован отдельно: колоды можно перегенерировать без пересборки образа
      - ./data:/srv/data:ro

volumes:
  pgdata:
  redisdata:
